<style>
:root{
  --ink:#0f0f12;--ink2:#1e1e28;--surface:#f5f3ee;--card:#fff;
  --accent:#e63946;--gold:#f4a261;--green:#2a9d8f;--blue:#264653;
  --muted:#8888a0;--border:#e8e6e0;
  --fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;--fm:'DM Mono',monospace;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--fb);background:var(--surface);color:var(--ink);overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:var(--safe-top)}

/* NAV */
nav{background:var(--ink);display:flex;align-items:center;justify-content:space-between;
  padding:0 1rem;height:52px;border-bottom:2px solid var(--accent);flex-shrink:0}
.nav-brand{font-family:var(--fh);font-weight:800;font-size:.9rem;color:#fff;white-space:nowrap}
.nav-brand span{color:var(--accent)}
.nav-right{display:flex;gap:.4rem}
.btn-nav{background:none;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.65);
  border-radius:6px;padding:.28rem .6rem;font-size:.62rem;font-family:var(--fm);cursor:pointer;
  letter-spacing:.04em;white-space:nowrap}
.btn-nav:hover,.btn-nav:active{border-color:var(--gold);color:var(--gold)}

/* BOTTOM TABS — mobile style */
.bottom-tabs{background:var(--ink);border-top:1px solid #2e2e3a;
  display:flex;flex-shrink:0;padding-bottom:var(--safe-bottom)}
.btab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:.5rem .25rem;cursor:pointer;border:none;background:none;
  font-family:var(--fm);font-size:.52rem;color:var(--muted);letter-spacing:.04em;
  text-transform:uppercase;gap:.2rem;transition:color .15s}
.btab:active{background:rgba(255,255,255,.05)}
.btab.active{color:var(--accent)}
.btab-icon{font-size:1.15rem;line-height:1}

/* SUMMARY BAR */
.summary-bar{background:var(--ink2);padding:.5rem 1rem;border-bottom:1px solid #2e2e3a;flex-shrink:0;overflow-x:auto}
#summary-cards{display:flex;gap:.5rem;min-width:max-content}

/* BODY */
.app-body{display:flex;flex:1;overflow:hidden}

/* SIDEBAR — hidden on mobile, shown on tablet */
aside{width:195px;background:var(--ink2);border-right:1px solid #2e2e3a;
  display:flex;flex-direction:column;flex-shrink:0}
@media(max-width:768px){aside{display:none}}
.sb-header{padding:.75rem;border-bottom:1px solid #2e2e3a}
.sb-title{font-family:var(--fm);font-size:.58rem;text-transform:uppercase;
  letter-spacing:.1em;color:var(--muted);margin-bottom:.55rem}
.btn-add{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;
  padding:.5rem;font-family:var(--fm);font-size:.66rem;letter-spacing:.04em;
  text-transform:uppercase;cursor:pointer}
.btn-add:active{background:#c0303c}
#sb-props{flex:1;overflow-y:auto;padding:.4rem}
.pi{padding:.55rem .75rem;border-radius:8px;cursor:pointer;margin-bottom:.25rem;position:relative}
.pi:hover{background:rgba(255,255,255,.05)}
.pi.active{background:rgba(230,57,70,.15);border:1px solid rgba(230,57,70,.3)}
.pi-name{font-size:.8rem;font-weight:600;color:#fff;font-family:var(--fh);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:1rem}
.pi-sub{font-size:.66rem;color:var(--muted);margin-top:.08rem}
.pi-del{position:absolute;top:.45rem;right:.45rem;background:none;border:none;
  color:var(--muted);cursor:pointer;font-size:.7rem;opacity:0}
.pi:hover .pi-del{opacity:1}
.pi-del:hover{color:var(--accent)}

main{flex:1;overflow-y:auto;padding:1rem 1.25rem;padding-bottom:2rem}

/* KPI CARDS */
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:.65rem 1rem;position:relative;overflow:hidden;min-width:130px}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi-card.g::before{background:var(--green)}.kpi-card.go::before{background:var(--gold)}
.kpi-card.b::before{background:var(--blue)}.kpi-card.i::before{background:var(--ink)}
.kl{font-family:var(--fm);font-size:.56rem;color:var(--muted);text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:.25rem}
.kv{font-family:var(--fh);font-weight:700;font-size:1.1rem;letter-spacing:-.03em}
.kpi-card.g .kv{color:var(--green)}.kpi-card.go .kv{color:var(--gold)}.kpi-card.b .kv{color:var(--blue)}
.ks{font-size:.62rem;color:var(--muted);margin-top:.12rem}

/* MOBILE PROP SELECTOR */
.mob-prop-bar{display:none;background:var(--ink2);border-bottom:1px solid #2e2e3a;
  padding:.5rem 1rem;gap:.5rem;overflow-x:auto}
@media(max-width:768px){.mob-prop-bar{display:flex}}
.mob-prop-btn{white-space:nowrap;border:1px solid rgba(255,255,255,.15);background:none;
  color:rgba(255,255,255,.6);border-radius:20px;padding:.35rem .85rem;
  font-family:var(--fm);font-size:.65rem;cursor:pointer}
.mob-prop-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.mob-add-btn{white-space:nowrap;border:1px dashed rgba(230,57,70,.5);background:none;
  color:var(--accent);border-radius:20px;padding:.35rem .85rem;
  font-family:var(--fm);font-size:.65rem;cursor:pointer}

/* TABLES */
.tc{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:1rem}
.tt{display:flex;align-items:center;justify-content:space-between;
  padding:.65rem 1rem;border-bottom:1px solid var(--border);background:var(--ink)}
.tt h3{font-family:var(--fh);font-weight:700;font-size:.85rem;color:#fff}
.badge{font-family:var(--fm);font-size:.58rem;padding:.15rem .5rem;
  border-radius:20px;background:rgba(255,255,255,.1);color:#fff;letter-spacing:.04em}
table{width:100%;border-collapse:collapse}
thead th{font-family:var(--fm);font-size:.58rem;font-weight:500;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em;padding:.5rem .75rem;
  text-align:right;background:#faf9f6;border-bottom:1px solid var(--border)}
thead th:first-child{text-align:left}
tbody td{padding:.48rem .75rem;font-size:.8rem;border-bottom:1px solid var(--border);
  text-align:right;font-family:var(--fm)}
tbody td:first-child{text-align:left;font-family:var(--fb)}
tbody tr:last-child td{border-bottom:none}
.rt td{background:#f0f0f5;font-weight:600;border-top:2px solid var(--border)}
.pos{color:var(--green)}.neg{color:var(--accent)}

/* INPUTS */
.ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.6rem;margin-bottom:1rem}
.ibox{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.75rem .9rem}
.ibox label{display:block;font-family:var(--fm);font-size:.56rem;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:.28rem}
.ibox input,.ibox select{width:100%;border:none;outline:none;font-family:var(--fh);
  font-weight:700;font-size:.95rem;color:var(--ink);background:transparent}
.irow{display:flex;align-items:center;gap:.3rem}
.ipfx{font-family:var(--fm);font-size:.75rem;color:var(--muted)}

/* MONTHS */
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:.6rem}
.mc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.75rem}
.mc-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.mc-name{font-family:var(--fh);font-weight:700;font-size:.82rem}
.mc-net{font-family:var(--fm);font-size:.74rem;font-weight:500}
.mf{display:grid;grid-template-columns:1fr 1fr;gap:.32rem}
.mf label{display:block;font-family:var(--fm);font-size:.54rem;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:.1rem}
.mf input{width:100%;border:1px solid var(--border);border-radius:5px;
  padding:.25rem .42rem;font-family:var(--fm);font-size:.74rem;
  background:var(--surface);color:var(--ink);outline:none}
.mf input:focus{border-color:var(--accent)}

/* BENCH */
.bg2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.6rem}
.bc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.9rem 1rem}
.bpl{font-family:var(--fm);font-size:.58rem;text-transform:uppercase;letter-spacing:.08em;
  padding:.14rem .48rem;border-radius:20px;display:inline-block;margin-bottom:.5rem}
.bb{font-family:var(--fh);font-weight:700;font-size:.88rem;margin-bottom:.15rem}
.bt{font-size:.73rem;color:var(--muted);margin-bottom:.55rem}
.bpr{display:flex;justify-content:space-between;align-items:flex-end}
.bpm{font-family:var(--fh);font-weight:800;font-size:1.2rem;letter-spacing:-.04em}
.bprange{font-size:.65rem;color:var(--muted);font-family:var(--fm)}
.boc{font-family:var(--fm);font-size:.72rem;color:var(--green)}

/* MISC */
.sl{font-family:var(--fm);font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);margin-bottom:.65rem;padding-bottom:.35rem;border-bottom:1px solid var(--border)}
.empty{color:var(--muted);font-size:.86rem;font-style:italic;padding:2rem;text-align:center}
.btn-sm{background:var(--surface);border:1px solid var(--border);border-radius:6px;
  padding:.24rem .6rem;font-size:.68rem;font-family:var(--fm);cursor:pointer;white-space:nowrap}
.btn-sm:active{border-color:var(--accent);color:var(--accent)}
.note{font-size:.72rem;color:var(--muted);font-style:italic;padding:.55rem .85rem;
  background:#faf9f6;border-left:3px solid var(--gold);border-radius:0 6px 6px 0;margin-top:.75rem}
.ap{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.ap div{display:flex;align-items:center;gap:.3rem;padding:.3rem .75rem;
  border-radius:30px;font-size:.72rem;font-weight:500}
.ap .ok{background:#e8f8f5;color:var(--green);border:1px solid #b8e8e2}
.ap .warn{background:#fff5e6;color:#b7601a;border:1px solid #f4c98a}
.ap .bad{background:#fff0f0;color:var(--accent);border:1px solid #f8b8bb}

/* INSTALL BANNER */
#install-banner{display:none;background:var(--gold);color:var(--ink);
  padding:.6rem 1rem;font-size:.78rem;font-family:var(--fb);
  align-items:center;justify-content:space-between;gap:.5rem;flex-shrink:0}
#install-banner.show{display:flex}
#install-banner strong{font-weight:600}
.btn-install{background:var(--ink);color:#fff;border:none;border-radius:6px;
  padding:.3rem .75rem;font-family:var(--fm);font-size:.68rem;cursor:pointer;white-space:nowrap}
.btn-dismiss{background:none;border:none;font-size:1rem;cursor:pointer;padding:.2rem}

/* SECTION CARD */
.section-card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:1rem 1.1rem;margin-bottom:1rem}
.section-card h4{font-family:var(--fh);font-weight:700;font-size:.9rem;margin-bottom:.75rem;
  color:var(--ink);border-bottom:1px solid var(--border);padding-bottom:.5rem}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div id="app">
  <!-- INSTALL BANNER (iOS) -->
  <div id="install-banner">
    <span>📱 <strong>Instalar no iPad/iPhone:</strong> Toque em <strong>Compartilhar</strong> → <strong>"Adicionar à Tela de Início"</strong></span>
    <button class="btn-dismiss" onclick="document.getElementById('install-banner').classList.remove('show');localStorage.setItem('dismissed_banner','1')">✕</button>
  </div>

  <nav>
    <div class="nav-brand">🏠 Airbnb <span>Tracker</span></div>
    <div class="nav-right">
      <button class="btn-nav" onclick="exportData()">⬇ Backup</button>
      <button class="btn-nav" onclick="document.getElementById('imp').click()">⬆ Importar</button>
      <input type="file" id="imp" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </nav>

  <div class="summary-bar"><div id="summary-cards"></div></div>

  <!-- Mobile property selector -->
  <div class="mob-prop-bar" id="mob-prop-bar"></div>

  <div class="app-body">
    <aside>
      <div class="sb-header">
        <div class="sb-title">Meus Imóveis</div>
        <button class="btn-add" onclick="addProp()">+ Adicionar Imóvel</button>
      </div>
      <div id="sb-props"></div>
    </aside>
    <main id="main"></main>
  </div>

  <!-- BOTTOM TABS -->
  <div class="bottom-tabs">
    <button class="btab active" data-view="dashboard"  onclick="sv('dashboard')"><span class="btab-icon">📊</span>Dashboard</button>
    <button class="btab"        data-view="custos"     onclick="sv('custos')"><span class="btab-icon">💰</span>Custos</button>
    <button class="btab"        data-view="rent"       onclick="sv('rent')"><span class="btab-icon">📈</span>Rentab.</button>
    <button class="btab"        data-view="valor"      onclick="sv('valor')"><span class="btab-icon">🏡</span>Valoriz.</button>
    <button class="btab"        data-view="config"     onclick="sv('config')"><span class="btab-icon">⚙️</span>Config.</button>
  </div>
</div>

<script>
const MN=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MF=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const BENCH=[
  {plat:'Airbnb',     bairro:'Vila Madalena',tipo:'Studio',   min:120,max:280,ocup:72},
  {plat:'Airbnb',     bairro:'Pinheiros',    tipo:'Studio',   min:130,max:300,ocup:75},
  {plat:'Airbnb',     bairro:'Itaim Bibi',   tipo:'1 Quarto', min:200,max:450,ocup:82},
  {plat:'Airbnb',     bairro:'Vila Madalena',tipo:'1 Quarto', min:180,max:380,ocup:78},
  {plat:'QuintoAndar',bairro:'Pinheiros',    tipo:'1 Quarto', min:190,max:420,ocup:80},
  {plat:'Booking',    bairro:'Pinheiros',    tipo:'Studio',   min:110,max:260,ocup:68},
  {plat:'Airbnb',     bairro:'Brooklin',     tipo:'2 Quartos',min:280,max:600,ocup:70},
  {plat:'Airbnb',     bairro:'Vila Olímpia', tipo:'2 Quartos',min:320,max:700,ocup:73},
];

// Default editable global indicators
const defIndicators=()=>({
  cdi:10.65, ipca:4.83, poupanca:7.14, selic:10.75,
  fipezap:[
    {ano:2020,nom:3.8,ipca:4.52},{ano:2021,nom:11.2,ipca:10.06},
    {ano:2022,nom:8.2,ipca:5.79},{ano:2023,nom:6.8,ipca:4.62},
    {ano:2024,nom:9.1,ipca:4.83}
  ]
});

let S={props:[],aid:null,view:'dashboard',indicators:defIndicators()};

const load=()=>{
  try{const d=localStorage.getItem('abt4');if(d){const p=JSON.parse(d);S={...S,...p};}}catch{}
  if(!S.props)S.props=[];
  if(!S.indicators)S.indicators=defIndicators();
  if(!S.aid&&S.props.length)S.aid=S.props[0].id;
};
const save=()=>localStorage.setItem('abt4',JSON.stringify(S));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const defM=()=>MF.map(m=>({mes:m,diarias:0,outras:0,ocup:0,diariaMed:0,limpeza:0,lavand:0,manut:0,cond:800,iptu:417,seguro:100,internet:150}));

const cm=m=>{
  const rec=(m.diarias||0)+(m.outras||0),taxa=rec*.03;
  const varT=(m.limpeza||0)+(m.lavand||0)+(m.manut||0)+taxa;
  const fixT=(m.cond||0)+(m.iptu||0)+(m.seguro||0)+(m.internet||0);
  const ir=Math.max(0,rec*.15),net=rec-fixT-varT-ir;
  return{rec,taxa,varT,fixT,ir,custos:fixT+varT+ir,net,ocup:(m.ocup||0)/100,diaria:m.diariaMed||0};
};
const cp=p=>{
  const ms=(p.meses||defM()).map(cm);
  const tR=ms.reduce((a,m)=>a+m.rec,0),tC=ms.reduce((a,m)=>a+m.custos,0),tN=ms.reduce((a,m)=>a+m.net,0);
  const aO=ms.reduce((a,m)=>a+m.ocup,0)/12,aD=ms.reduce((a,m)=>a+m.diaria,0)/12;
  const inv=(p.compra||0)+(p.reforma||0),roi=inv?tN/inv*100:0,pb=tN>0?inv/tN:null;
  return{ms,tR,tC,tN,aO,aD,inv,roi,pb};
};

const f=v=>v==null||isNaN(v)?'—':v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const fp=v=>isNaN(v)||v==null?'—':v.toFixed(1)+'%';
const fk=v=>{if(v==null||isNaN(v))return'—';if(Math.abs(v)>=1e6)return'R$ '+(v/1e6).toFixed(2)+'M';if(Math.abs(v)>=1e3)return'R$ '+(v/1e3).toFixed(0)+'k';return f(v);};

function addProp(){
  const p={id:uid(),nome:'Novo Imóvel',bairro:'São Paulo/SP',tipo:'1 quarto',compra:350000,reforma:80000,meses:defM()};
  S.props.push(p);S.aid=p.id;save();ra();sv('custos');
}
function delProp(id){if(!confirm('Remover este imóvel?'))return;S.props=S.props.filter(x=>x.id!==id);if(S.aid===id)S.aid=S.props[0]?.id||null;save();ra();}
function selProp(id){S.aid=id;save();ra();}
function sv(v){S.view=v;save();
  document.querySelectorAll('.btab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));
  rm();}
function upP(f2,v){const p=S.props.find(x=>x.id===S.aid);if(!p)return;p[f2]=isNaN(parseFloat(v))?v:parseFloat(v);save();rSum();rSb();rMob();}
function upM(i,f2,v){const p=S.props.find(x=>x.id===S.aid);if(!p)return;if(!p.meses)p.meses=defM();p.meses[i][f2]=parseFloat(v)||0;save();
  const c=cm(p.meses[i]);const el=document.getElementById('mn'+i);
  if(el){el.textContent=f(c.net);el.style.color=c.net>=0?'var(--green)':'var(--accent)';}
  rSum();rSb();rMob();}
function upInd(key,v){S.indicators[key]=parseFloat(v)||0;save();}
function upFipe(i,key,v){S.indicators.fipezap[i][key]=parseFloat(v)||0;save();}
function addFipeRow(){S.indicators.fipezap.push({ano:new Date().getFullYear(),nom:0,ipca:0});save();rm();}
function delFipeRow(i){S.indicators.fipezap.splice(i,1);save();rm();}

function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='airbnb-backup.json';a.click();}
function importData(e){const fi=e.target.files[0];if(!fi)return;const r=new FileReader();r.onload=ev=>{try{S=JSON.parse(ev.target.result);save();ra();}catch{alert('Arquivo inválido.');}};r.readAsText(fi);}

function rSum(){

  let tR=0,tN=0,tI=0,tO=0;

}

function rm(){const v=S.view;

const isSafari=/safari/i.test(navigator.userAgent)&&!/chrome/i.test(navigator.userAgent);
const dismissed=localStorage.getItem('dismissed_banner');
if(isIOS&&isSafari&&!dismissed&&!window.navigator.standalone){
  document.getElementById('install-banner').classList.add('show');
}

// Service Worker for offline support
if('serviceWorker' in navigator){
  const sw=`
    const CACHE='abt-v1';
    self.addEventListener('install',e=>e.waitUntil(
      caches.open(CACHE).then(c=>c.addAll(['./',location.href]))
    ));
    self.addEventListener('fetch',e=>e.respondWith(
      caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match('./')))
    ));`;
  const blob2=new Blob([sw],{type:'text/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob2)).catch(()=>{});
}
</script>
