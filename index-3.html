<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Airbnb Tracker">
<meta name="theme-color" content="#0f0f12">
<title>Airbnb Investment Tracker</title>
<script>
const m2={name:"Airbnb Investment Tracker",short_name:"Airbnb Tracker",start_url:"./",display:"standalone",background_color:"#0f0f12",theme_color:"#0f0f12"};
const bl=new Blob([JSON.stringify(m2)],{type:'application/json'});
const lk=document.createElement('link');lk.rel='manifest';lk.href=URL.createObjectURL(bl);document.head.appendChild(lk);
</script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f0f12;--ink2:#1e1e28;--surface:#f5f3ee;--card:#fff;--accent:#e63946;--gold:#f4a261;--green:#2a9d8f;--blue:#264653;--muted:#8888a0;--border:#e8e6e0;--fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;--fm:'DM Mono',monospace;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--fb);background:var(--surface);color:var(--ink);overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:var(--st)}
nav{background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 1rem;height:52px;border-bottom:2px solid var(--accent);flex-shrink:0}
.nb{font-family:var(--fh);font-weight:800;font-size:.9rem;color:#fff}.nb span{color:var(--accent)}
.nr{display:flex;gap:.4rem}
.bn{background:none;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.65);border-radius:6px;padding:.28rem .6rem;font-size:.62rem;font-family:var(--fm);cursor:pointer;letter-spacing:.04em;white-space:nowrap}
.bn:hover{border-color:var(--gold);color:var(--gold)}
.sbar{background:var(--ink2);padding:.5rem 1rem;border-bottom:1px solid #2e2e3a;flex-shrink:0;overflow-x:auto}
#sc{display:flex;gap:.5rem;min-width:max-content}
.ab{display:flex;flex:1;overflow:hidden}
aside{width:195px;background:var(--ink2);border-right:1px solid #2e2e3a;display:flex;flex-direction:column;flex-shrink:0}
@media(max-width:768px){aside{display:none}}
.sbh{padding:.75rem;border-bottom:1px solid #2e2e3a}
.sbt{font-family:var(--fm);font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.55rem}
.badd{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:.5rem;font-family:var(--fm);font-size:.66rem;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
#sp{flex:1;overflow-y:auto;padding:.4rem}
.pi{padding:.55rem .75rem;border-radius:8px;cursor:pointer;margin-bottom:.25rem;position:relative}
.pi:hover{background:rgba(255,255,255,.05)}.pi.active{background:rgba(230,57,70,.15);border:1px solid rgba(230,57,70,.3)}
.pn{font-size:.8rem;font-weight:600;color:#fff;font-family:var(--fh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:1rem}
.ps{font-size:.66rem;color:var(--muted);margin-top:.08rem}
.pd{position:absolute;top:.45rem;right:.45rem;background:none;border:none;color:var(--muted);cursor:pointer;font-size:.7rem;opacity:0}
.pi:hover .pd{opacity:1}.pd:hover{color:var(--accent)}
main{flex:1;overflow-y:auto;padding:1rem 1.25rem;padding-bottom:2rem}
.mpb{display:none;background:var(--ink2);border-bottom:1px solid #2e2e3a;padding:.5rem 1rem;gap:.5rem;overflow-x:auto}
@media(max-width:768px){.mpb{display:flex}}
.mpbn{white-space:nowrap;border:1px solid rgba(255,255,255,.15);background:none;color:rgba(255,255,255,.6);border-radius:20px;padding:.35rem .85rem;font-family:var(--fm);font-size:.65rem;cursor:pointer}
.mpbn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.mpadd{white-space:nowrap;border:1px dashed rgba(230,57,70,.5);background:none;color:var(--accent);border-radius:20px;padding:.35rem .85rem;font-family:var(--fm);font-size:.65rem;cursor:pointer}
.bttabs{background:var(--ink);border-top:1px solid #2e2e3a;display:flex;flex-shrink:0;padding-bottom:var(--sb)}
.btab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.5rem .25rem;cursor:pointer;border:none;background:none;font-family:var(--fm);font-size:.52rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;gap:.2rem}
.btab.active{color:var(--accent)}.bti{font-size:1.15rem;line-height:1}
.kc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.65rem 1rem;position:relative;overflow:hidden;min-width:130px}
.kc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kc.g::before{background:var(--green)}.kc.go::before{background:var(--gold)}.kc.b::before{background:var(--blue)}.kc.i::before{background:var(--ink)}
.kl{font-family:var(--fm);font-size:.56rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.25rem}
.kv{font-family:var(--fh);font-weight:700;font-size:1.1rem;letter-spacing:-.03em}
.kc.g .kv{color:var(--green)}.kc.go .kv{color:var(--gold)}.kc.b .kv{color:var(--blue)}.ks{font-size:.62rem;color:var(--muted);margin-top:.12rem}
.tc{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:1rem}
.tt{display:flex;align-items:center;justify-content:space-between;padding:.65rem 1rem;border-bottom:1px solid var(--border);background:var(--ink)}
.tt h3{font-family:var(--fh);font-weight:700;font-size:.85rem;color:#fff}
.bdg{font-family:var(--fm);font-size:.58rem;padding:.15rem .5rem;border-radius:20px;background:rgba(255,255,255,.1);color:#fff;letter-spacing:.04em}
table{width:100%;border-collapse:collapse}
thead th{font-family:var(--fm);font-size:.58rem;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:.5rem .75rem;text-align:right;background:#faf9f6;border-bottom:1px solid var(--border)}
thead th:first-child{text-align:left}
tbody td{padding:.48rem .75rem;font-size:.8rem;border-bottom:1px solid var(--border);text-align:right;font-family:var(--fm)}
tbody td:first-child{text-align:left;font-family:var(--fb)}
tbody tr:last-child td{border-bottom:none}
.rt td{background:#f0f0f5;font-weight:600;border-top:2px solid var(--border)}
.pos{color:var(--green)}.neg{color:var(--accent)}
.ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.6rem;margin-bottom:1rem}
.ib{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.75rem .9rem}
.ib label{display:block;font-family:var(--fm);font-size:.56rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.28rem}
.ib input{width:100%;border:none;outline:none;font-family:var(--fh);font-weight:700;font-size:.95rem;color:var(--ink);background:transparent}
.irow{display:flex;align-items:center;gap:.3rem}.ipfx{font-family:var(--fm);font-size:.75rem;color:var(--muted)}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:.65rem}
.mc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.8rem}
.mch{display:flex;justify-content:space-between;align-items:center;margin-bottom:.55rem}
.mcn{font-family:var(--fh);font-weight:700;font-size:.85rem}
.mnet{font-family:var(--fm);font-size:.76rem;font-weight:500}
.mf{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}
.mf label{display:block;font-family:var(--fm);font-size:.54rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.1rem}
.mf input{width:100%;border:1px solid var(--border);border-radius:5px;padding:.26rem .45rem;font-family:var(--fm);font-size:.76rem;background:var(--surface);color:var(--ink);outline:none}
.mf input:focus{border-color:var(--accent)}
.admbdg{font-family:var(--fm);font-size:.72rem;padding:.26rem .45rem;background:#f0f4f0;border-radius:5px;border:1px solid #c8e6c9;color:var(--green);text-align:right;font-weight:600}
.bg2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.65rem}
.bc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.9rem 1rem}
.bpl{font-family:var(--fm);font-size:.58rem;text-transform:uppercase;letter-spacing:.08em;padding:.14rem .48rem;border-radius:20px;display:inline-block;margin-bottom:.5rem}
.bba{font-family:var(--fh);font-weight:700;font-size:.88rem;margin-bottom:.15rem}
.bty{font-size:.73rem;color:var(--muted);margin-bottom:.55rem}
.bpr{display:flex;justify-content:space-between;align-items:flex-end}
.bpm{font-family:var(--fh);font-weight:800;font-size:1.2rem;letter-spacing:-.04em}
.bpr2{font-size:.65rem;color:var(--muted);font-family:var(--fm)}
.boc{font-family:var(--fm);font-size:.72rem;color:var(--green)}
.sl{font-family:var(--fm);font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.65rem;padding-bottom:.35rem;border-bottom:1px solid var(--border)}
.empty{color:var(--muted);font-size:.88rem;font-style:italic;padding:2rem;text-align:center}
.bsm{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.24rem .6rem;font-size:.68rem;font-family:var(--fm);cursor:pointer;white-space:nowrap}
.note{font-size:.72rem;color:var(--muted);font-style:italic;padding:.55rem .85rem;background:#faf9f6;border-left:3px solid var(--gold);border-radius:0 6px 6px 0;margin-top:.75rem}
.ap{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.ap div{display:flex;align-items:center;gap:.3rem;padding:.3rem .75rem;border-radius:30px;font-size:.72rem;font-weight:500}
.ap .ok{background:#e8f8f5;color:var(--green);border:1px solid #b8e8e2}
.ap .warn{background:#fff5e6;color:#b7601a;border:1px solid #f4c98a}
.ap .bad{background:#fff0f0;color:var(--accent);border:1px solid #f8b8bb}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div id="app">
<nav>
  <div class="nb">🏠 Airbnb <span>Tracker</span></div>
  <div class="nr">
    <button class="bn" onclick="exportData()">⬇ Backup</button>
    <button class="bn" onclick="document.getElementById('imp').click()">⬆ Importar</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</nav>
<div class="sbar"><div id="sc"></div></div>
<div class="mpb" id="mpb"></div>
<div class="ab">
  <aside>
    <div class="sbh"><div class="sbt">Meus Imóveis</div><button class="badd" onclick="addProp()">+ Adicionar Imóvel</button></div>
    <div id="sp"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="bttabs">
  <button class="btab active" data-view="dashboard" onclick="sv('dashboard')"><span class="bti">📊</span>Dashboard</button>
  <button class="btab" data-view="custos" onclick="sv('custos')"><span class="bti">💰</span>Custos</button>
  <button class="btab" data-view="rent" onclick="sv('rent')"><span class="bti">📈</span>Rentab.</button>
  <button class="btab" data-view="valor" onclick="sv('valor')"><span class="bti">🏡</span>Valoriz.</button>
  <button class="btab" data-view="config" onclick="sv('config')"><span class="bti">⚙️</span>Config.</button>
</div>
</div>
<script>
const MN=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MF=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const ADM=0.17;

// STUDIOS APENAS — SP Zona Sul/Oeste
const BENCH=[
  {plat:'Airbnb',     bairro:'Brooklin',     min:180,max:380,med:265,ocup:72},
  {plat:'Airbnb',     bairro:'Vila Olímpia', min:200,max:420,med:295,ocup:74},
  {plat:'Airbnb',     bairro:'Pinheiros',    min:190,max:350,med:255,ocup:75},
  {plat:'Airbnb',     bairro:'Vila Madalena',min:150,max:320,med:230,ocup:70},
  {plat:'Airbnb',     bairro:'Itaim Bibi',   min:210,max:400,med:290,ocup:78},
  {plat:'QuintoAndar',bairro:'Brooklin',     min:170,max:360,med:250,ocup:71},
  {plat:'Booking',    bairro:'Pinheiros',    min:160,max:300,med:220,ocup:68},
  {plat:'Booking',    bairro:'Vila Olímpia', min:180,max:350,med:255,ocup:70},
];

const defInd=()=>({
  cdi:14.79,ipca:3.81,poupanca:10.32,selic:14.75,
  fipezap:[
    {ano:2020,nom:2.1, ipca:4.52},
    {ano:2021,nom:9.8, ipca:10.06},
    {ano:2022,nom:7.5, ipca:5.79},
    {ano:2023,nom:6.2, ipca:4.62},
    {ano:2024,nom:8.4, ipca:4.83},
    {ano:2025,nom:7.5, ipca:4.26},
  ]
});

let S={props:[],aid:null,view:'dashboard',indicators:defInd()};

const load=()=>{
  try{const d=localStorage.getItem('abt6');if(d){const p=JSON.parse(d);S={...S,...p};}}catch{}
  if(!S.props)S.props=[];if(!S.indicators)S.indicators=defInd();
  if(!S.aid&&S.props.length)S.aid=S.props[0].id;
};
const save=()=>localStorage.setItem('abt6',JSON.stringify(S));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);

const defM=()=>MF.map(m=>({mes:m,diarias:0,outras:0,limpLav:0,intLuz:0,manut:0,cond:0,iptu:0,seguro:0}));

const cm=m=>{
  const rec=(m.diarias||0)+(m.outras||0);
  const adm=rec*ADM;
  const varT=adm+(m.limpLav||0)+(m.intLuz||0)+(m.manut||0);
  const fixT=(m.cond||0)+(m.iptu||0)+(m.seguro||0);
  const ir=Math.max(0,rec*0.15);
  const net=rec-fixT-varT-ir;
  return{rec,adm,varT,fixT,ir,custos:fixT+varT+ir,net};
};

const cp=p=>{
  const ms=(p.meses||defM()).map(cm);
  const tR=ms.reduce((a,m)=>a+m.rec,0),tC=ms.reduce((a,m)=>a+m.custos,0),tN=ms.reduce((a,m)=>a+m.net,0);
  const inv=(p.compra||0)+(p.reforma||0),roi=inv?tN/inv*100:0,pb=tN>0?inv/tN:null;
  return{ms,tR,tC,tN,inv,roi,pb};
};

const f=v=>v==null||isNaN(v)?'—':v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const fp=v=>isNaN(v)||v==null?'—':v.toFixed(1)+'%';
const fk=v=>{if(v==null||isNaN(v))return'—';if(Math.abs(v)>=1e6)return'R$ '+(v/1e6).toFixed(2)+'M';if(Math.abs(v)>=1e3)return'R$ '+(v/1e3).toFixed(0)+'k';return f(v);};

function addProp(){const p={id:uid(),nome:'Novo Imóvel',bairro:'Brooklin – SP',tipo:'Studio',compra:0,reforma:0,meses:defM()};S.props.push(p);S.aid=p.id;save();ra();sv('custos');}
function delProp(id){if(!confirm('Remover?'))return;S.props=S.props.filter(x=>x.id!==id);if(S.aid===id)S.aid=S.props[0]?.id||null;save();ra();}
function selProp(id){S.aid=id;save();ra();}
function sv(v){S.view=v;save();document.querySelectorAll('.btab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));rm();}
function upP(fld,v){const p=S.props.find(x=>x.id===S.aid);if(!p)return;p[fld]=isNaN(parseFloat(v))?v:parseFloat(v);save();rSum();rSb();rMob();}
function upM(i,fld,v){
  const p=S.props.find(x=>x.id===S.aid);if(!p)return;
  if(!p.meses)p.meses=defM();
  p.meses[i][fld]=parseFloat(v)||0;save();
  const c=cm(p.meses[i]);
  const el=document.getElementById('mn'+i);if(el){el.textContent=f(c.net);el.style.color=c.net>=0?'var(--green)':'var(--accent)';}
  const ae=document.getElementById('adm'+i);if(ae)ae.textContent=f(c.adm);
  rSum();
}
function upInd(k,v){S.indicators[k]=parseFloat(v)||0;save();}
function upFipe(i,k,v){S.indicators.fipezap[i][k]=parseFloat(v)||0;save();}
function addFipeRow(){S.indicators.fipezap.push({ano:new Date().getFullYear(),nom:0,ipca:0});save();rm();}
function delFipeRow(i){S.indicators.fipezap.splice(i,1);save();rm();}
function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='airbnb-backup.json';a.click();}
function importData(e){const fi=e.target.files[0];if(!fi)return;const r=new FileReader();r.onload=ev=>{try{S=JSON.parse(ev.target.result);save();ra();}catch{alert('Arquivo inválido.');}};r.readAsText(fi);}

function ra(){rSb();rMob();rSum();rm();}

function rSb(){
  document.getElementById('sp').innerHTML=S.props.map(p=>`
    <div class="pi ${p.id===S.aid?'active':''}" onclick="selProp('${p.id}')">
      <div class="pn">${p.nome}</div><div class="ps">${p.bairro}</div>
      <button class="pd" onclick="event.stopPropagation();delProp('${p.id}')">✕</button>
    </div>`).join('');
}

function rMob(){
  document.getElementById('mpb').innerHTML=
    S.props.map(p=>`<button class="mpbn ${p.id===S.aid?'active':''}" onclick="selProp('${p.id}')">${p.nome}</button>`).join('')+
    `<button class="mpadd" onclick="addProp()">+ Novo</button>`;
}

function rSum(){
  if(!S.props.length){document.getElementById('sc').innerHTML='<span style="color:var(--muted);font-size:.75rem;font-family:var(--fm)">Adicione um imóvel para começar</span>';return;}
  let tR=0,tN=0,tI=0;
  S.props.forEach(p=>{const c=cp(p);tR+=c.tR;tN+=c.tN;tI+=c.inv;});
  const n=S.props.length;
  document.getElementById('sc').innerHTML=`
    <div class="kc g"><div class="kl">Receita Portfolio</div><div class="kv">${fk(tR)}</div><div class="ks">${n} imóvel(is)</div></div>
    <div class="kc i"><div class="kl">Lucro Líquido</div><div class="kv" style="color:${tN>=0?'var(--green)':'var(--accent)'}">${fk(tN)}</div><div class="ks">Após todos os custos</div></div>
    <div class="kc go"><div class="kl">ROI Consolidado</div><div class="kv" style="color:var(--gold)">${fp(tI?tN/tI*100:0)}</div><div class="ks">${fk(tI)} invest.</div></div>
    <div class="kc b"><div class="kl">Adm Total (17%)</div><div class="kv">${fk(tR*ADM)}</div><div class="ks">Custo gestão</div></div>`;
}

function rm(){const v=S.view;
  if(v==='dashboard')rDash();else if(v==='custos')rCustos();
  else if(v==='rent')rRent();else if(v==='valor')rValor();else if(v==='config')rConfig();}

function rDash(){
  const m=document.getElementById('main');
  if(!S.props.length){m.innerHTML='<div class="empty">Toque em <strong>+ Novo</strong> para começar.</div>';return;}
  const ap=S.props.find(x=>x.id===S.aid);
  const ind=S.indicators;
  let alerts='';
  if(ap){const c=cp(ap),cdi=ind.cdi/100,ipca=ind.ipca/100;
    alerts=`<div class="ap">
      <div class="${c.roi/100>=cdi?'ok':'bad'}">${c.roi/100>=cdi?'✅':'⚠️'} ROI ${fp(c.roi)} vs CDI ${fp(cdi*100)}</div>
      <div class="${c.roi/100>=ipca?'ok':'bad'}">${c.roi/100>=ipca?'✅':'❌'} ${c.roi/100>=ipca?'Acima':'Abaixo'} da inflação ${fp(ipca*100)}</div>
    </div>`;}
  const rows=S.props.map(p=>{const c=cp(p),cdi=ind.cdi/100;return`<tr>
    <td><strong>${p.nome}</strong><br><small style="color:var(--muted)">${p.bairro}</small></td>
    <td class="pos">${fk(c.tR)}</td><td style="color:var(--muted);font-size:.75rem">${fk(c.tR*ADM)}</td>
    <td>${fk(c.tC)}</td><td style="color:${c.tN>=0?'var(--green)':'var(--accent)'}"><strong>${fk(c.tN)}</strong></td>
    <td>${c.roi/100>=cdi?'✅':'⚠️'} ${fp(c.roi)}</td>
    <td>${c.pb?c.pb.toFixed(1)+' anos':'—'}</td>
    <td><button class="bsm" onclick="selProp('${p.id}');sv('custos')">→</button></td>
  </tr>`;}).join('');
  m.innerHTML=`${alerts}
    <div class="sl">📊 Comparativo por Imóvel</div>
    <div class="tc"><div class="tt"><h3>Todos os Imóveis</h3><span class="bdg">${S.props.length} imóvel(is)</span></div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th style="text-align:left">Imóvel</th><th>Receita</th><th>Adm 17%</th><th>Custos</th><th>Lucro</th><th>ROI</th><th>Payback</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div></div>
    ${ap?`<div class="sl" style="margin-top:1.25rem">📅 Mensal — ${ap.nome}</div>${mTbl(ap)}`:''}`;
}

function mTbl(p){
  const c=cp(p);
  const rows=c.ms.map((m,i)=>`<tr>
    <td><strong>${MN[i]}</strong></td>
    <td class="pos">${f(m.rec)}</td>
    <td style="color:var(--green);font-size:.75rem">${f(m.adm)}</td>
    <td>${f(m.fixT)}</td><td>${f(m.varT)}</td><td>${f(m.ir)}</td>
    <td style="color:${m.net>=0?'var(--green)':'var(--accent)'}"><strong>${f(m.net)}</strong></td>
  </tr>`).join('');
  return`<div class="tc"><div class="tt"><h3>${p.nome}</h3></div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th style="text-align:left">Mês</th><th>Receita</th><th>Adm 17%</th><th>C.Fix</th><th>C.Var</th><th>IR</th><th>Lucro</th></tr></thead>
      <tbody>${rows}
        <tr class="rt"><td><strong>TOTAL</strong></td>
          <td class="pos"><strong>${f(c.tR)}</strong></td>
          <td><strong>${f(c.tR*ADM)}</strong></td>
          <td><strong>${f(c.ms.reduce((a,m)=>a+m.fixT,0))}</strong></td>
          <td><strong>${f(c.ms.reduce((a,m)=>a+m.varT,0))}</strong></td>
          <td><strong>${f(c.ms.reduce((a,m)=>a+m.ir,0))}</strong></td>
          <td style="color:${c.tN>=0?'var(--green)':'var(--accent)'}"><strong>${f(c.tN)}</strong></td></tr>
      </tbody></table></div></div>`;
}

function rCustos(){
  const m=document.getElementById('main');
  const p=S.props.find(x=>x.id===S.aid);
  if(!p){m.innerHTML='<div class="empty">Selecione ou adicione um imóvel.</div>';return;}
  if(!p.meses)p.meses=defM();
  m.innerHTML=`
    <div class="sl">⚙️ Dados do Imóvel</div>
    <div class="ig">
      <div class="ib"><label>Nome</label><input type="text" value="${p.nome}" onchange="upP('nome',this.value)"></div>
      <div class="ib"><label>Bairro / Cidade</label><input type="text" value="${p.bairro}" onchange="upP('bairro',this.value)"></div>
      <div class="ib"><label>Tipologia</label><input type="text" value="${p.tipo||''}" onchange="upP('tipo',this.value)"></div>
      <div class="ib"><label>Valor de Compra (R$)</label><div class="irow"><span class="ipfx">R$</span>
        <input type="number" value="${p.compra||0}" onchange="upP('compra',this.value)"></div></div>
      <div class="ib"><label>Valor da Reforma (R$)</label><div class="irow"><span class="ipfx">R$</span>
        <input type="number" value="${p.reforma||0}" onchange="upP('reforma',this.value)"></div></div>
    </div>
    <div class="note" style="margin-bottom:1rem">💡 <strong>Adm (17%)</strong> calculado automaticamente sobre a receita. IR (15%) calculado sobre receita bruta.</div>
    <div class="sl">💰 Receitas & Custos por Mês</div>
    <div class="mg">
      ${p.meses.map((mm,i)=>{const c=cm(mm);return`<div class="mc">
        <div class="mch"><span class="mcn">${MF[i]}</span>
          <span class="mnet" id="mn${i}" style="color:${c.net>=0?'var(--green)':'var(--accent)'}">${f(c.net)}</span></div>
        <div class="mf">
          <div style="grid-column:span 2"><label>Receita Diárias R$</label>
            <input type="number" value="${mm.diarias||0}" onchange="upM(${i},'diarias',this.value)" style="width:100%"></div>
          <div style="grid-column:span 2"><label>Adm 17% (automático)</label>
            <div class="admbdg" id="adm${i}">${f(c.adm)}</div></div>
          <div><label>Outras Rec. R$</label><input type="number" value="${mm.outras||0}" onchange="upM(${i},'outras',this.value)"></div>
          <div><label>Condomínio R$</label><input type="number" value="${mm.cond||0}" onchange="upM(${i},'cond',this.value)"></div>
          <div><label>IPTU R$</label><input type="number" value="${mm.iptu||0}" onchange="upM(${i},'iptu',this.value)"></div>
          <div><label>Seguro R$</label><input type="number" value="${mm.seguro||0}" onchange="upM(${i},'seguro',this.value)"></div>
          <div style="grid-column:span 2"><label>Limpeza + Lavanderia R$</label>
            <input type="number" value="${mm.limpLav||0}" onchange="upM(${i},'limpLav',this.value)" style="width:100%"></div>
          <div style="grid-column:span 2"><label>Internet + Luz R$</label>
            <input type="number" value="${mm.intLuz||0}" onchange="upM(${i},'intLuz',this.value)" style="width:100%"></div>
          <div style="grid-column:span 2"><label>Manutenção R$</label>
            <input type="number" value="${mm.manut||0}" onchange="upM(${i},'manut',this.value)" style="width:100%"></div>
        </div></div>`;}).join('')}
    </div>`;
}

function rRent(){
  const m=document.getElementById('main');
  const ind=S.indicators;
  if(!S.props.length){m.innerHTML='<div class="empty">Nenhum imóvel.</div>';return;}
  m.innerHTML='<div class="sl">📈 Análise por Imóvel</div>'+S.props.map(p=>{
    const c=cp(p),cdi=ind.cdi/100,ipca=ind.ipca/100,poup=ind.poupanca/100;
    const items=[{l:'🏠 Airbnb',pct:c.roi,col:'var(--accent)'},{l:'🏦 CDI',pct:cdi*100,col:'var(--blue)'},
      {l:'📉 IPCA',pct:ipca*100,col:'var(--gold)'},{l:'💰 Poupança',pct:poup*100,col:'var(--green)'}];
    const mx=Math.max(...items.map(x=>x.pct));
    return`<div class="tc" style="margin-bottom:1rem">
      <div class="tt"><h3>🏠 ${p.nome}</h3><span class="bdg">${fk(c.inv)} invest.</span></div>
      <div style="padding:.875rem">
        <div class="ig" style="margin-bottom:1rem">
          <div class="ib"><label>CDI % a.a.</label><div class="irow"><input type="number" value="${ind.cdi}" step="0.01" onchange="upInd('cdi',this.value);ra()"><span class="ipfx">%</span></div></div>
          <div class="ib"><label>IPCA % a.a.</label><div class="irow"><input type="number" value="${ind.ipca}" step="0.01" onchange="upInd('ipca',this.value);ra()"><span class="ipfx">%</span></div></div>
        </div>
        ${items.map(({l,pct,col})=>`<div style="display:flex;align-items:center;gap:.75rem;margin-bottom:.45rem">
          <span style="min-width:100px;font-size:.82rem">${l}</span>
          <span style="font-family:var(--fm);font-weight:600;color:${col};min-width:46px">${fp(pct)}</span>
          <div style="flex:1;height:7px;background:var(--border);border-radius:4px;overflow:hidden">
            <div style="height:100%;width:${mx>0?Math.round(pct/mx*100):0}%;background:${col};border-radius:4px"></div></div>
          <span style="font-size:.68rem;color:var(--muted);min-width:65px;text-align:right">${fk(c.inv*pct/100)}/ano</span>
        </div>`).join('')}
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;margin-top:.875rem">
          ${[['Lucro Líquido',f(c.tN),c.tN>=0?'var(--green)':'var(--accent)'],
             ['Payback',c.pb?c.pb.toFixed(1)+' anos':'—','var(--ink)'],
             ['Adm Anual',f(c.tR*ADM),'var(--muted)']
          ].map(([l,v,col])=>`<div style="background:var(--surface);border-radius:8px;padding:.55rem;text-align:center">
            <div style="font-family:var(--fm);font-size:.54rem;color:var(--muted);text-transform:uppercase;margin-bottom:.2rem">${l}</div>
            <div style="font-family:var(--fh);font-weight:700;font-size:.9rem;color:${col}">${v}</div>
          </div>`).join('')}
        </div>
      </div></div>`;}).join('');
}

function rValor(){
  const m=document.getElementById('main');
  const ind=S.indicators;
  const fipe=ind.fipezap||[];
  const avgNom=fipe.length?fipe.reduce((a,r)=>a+(r.nom||0),0)/fipe.length:7.5;
  const avgIpca=fipe.length?fipe.reduce((a,r)=>a+(r.ipca||0),0)/fipe.length:0;
  const avgReal=fipe.length?fipe.reduce((a,r)=>{const vr=r.nom&&r.ipca?(r.nom/(1+r.ipca/100)-1)*100:0;return a+vr;},0)/fipe.length:0;
  const sc=[{l:'🐻 Pessimista',r:.04,bg:'#fff1f0',col:'var(--accent)'},
            {l:'📊 Histórico', r:avgNom/100,bg:'#eef7f6',col:'var(--green)'},
            {l:'🐂 Otimista',  r:.12,bg:'#fffbf0',col:'var(--gold)'}];
  const yrs=[1,2,3,5,10];
  const fipeRows=fipe.map((r,i)=>{
    const vr=r.nom&&r.ipca?(r.nom/(1+r.ipca/100)-1)*100:0;
    return`<tr>
      <td><input type="number" value="${r.ano}" style="width:58px;border:none;background:transparent;font-family:var(--fm);font-size:.78rem;outline:none;color:var(--ink)" onchange="upFipe(${i},'ano',this.value)"></td>
      <td><div class="irow" style="justify-content:flex-end"><input type="number" value="${r.nom}" step="0.1" style="width:50px;border:1px solid var(--border);border-radius:4px;padding:.2rem .3rem;font-family:var(--fm);font-size:.76rem;text-align:right;background:var(--surface)" onchange="upFipe(${i},'nom',this.value)"><span style="font-size:.66rem;color:var(--muted)">%</span></div></td>
      <td><div class="irow" style="justify-content:flex-end"><input type="number" value="${r.ipca}" step="0.1" style="width:50px;border:1px solid var(--border);border-radius:4px;padding:.2rem .3rem;font-family:var(--fm);font-size:.76rem;text-align:right;background:var(--surface)" onchange="upFipe(${i},'ipca',this.value)"><span style="font-size:.66rem;color:var(--muted)">%</span></div></td>
      <td class="${vr>=0?'pos':'neg'}">${fp(vr)}</td>
      <td><button onclick="delFipeRow(${i})" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:.78rem">✕</button></td>
    </tr>`;}).join('');

  m.innerHTML=`
    <div class="sl">📅 FipeZap Brooklin SP (Editável)</div>
    <div class="tc" style="margin-bottom:1rem">
      <div class="tt"><h3>Histórico de Valorização</h3><span class="bdg">Editável — Fonte: FipeZap/IBGE</span></div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th style="text-align:left">Ano</th><th>Var. Nominal</th><th>IPCA</th><th>Var. Real</th><th></th></tr></thead>
        <tbody>${fipeRows}
          <tr class="rt"><td><strong>Média</strong></td>
            <td class="pos"><strong>${fp(avgNom)}</strong></td>
            <td><strong>${fp(avgIpca)}</strong></td>
            <td class="pos"><strong>${fp(avgReal)}</strong></td><td></td></tr>
        </tbody></table></div>
      <div style="padding:.65rem 1rem;border-top:1px solid var(--border)">
        <button class="bsm" onclick="addFipeRow()">+ Adicionar Ano</button>
      </div>
    </div>
    <div class="sl">🔮 Projeções por Imóvel</div>
    ${S.props.length?S.props.map(p=>{const inv=(p.compra||0)+(p.reforma||0);return`
      <div class="tc" style="margin-bottom:1rem">
        <div class="tt"><h3>🏠 ${p.nome}</h3><span class="bdg">${fk(inv)} invest.</span></div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;padding:.875rem">
          ${sc.map(s=>`<div style="border-radius:10px;overflow:hidden;border:1px solid var(--border)">
            <div style="padding:.65rem .85rem;font-family:var(--fh);font-weight:700;font-size:.82rem;background:${s.bg};color:${s.col}">
              ${s.l}<br><small style="font-weight:400">${fp(s.r*100)} a.a.</small></div>
            ${yrs.map(y=>`<div style="display:flex;justify-content:space-between;padding:.38rem .85rem;border-bottom:1px solid var(--border);font-size:.75rem">
              <span style="color:var(--muted);font-family:var(--fm)">${y}a</span>
              <span style="font-family:var(--fm);font-weight:500">${fk(inv*Math.pow(1+s.r,y))}</span>
            </div>`).join('')}
          </div>`).join('')}
        </div></div>`;}).join('')
    :'<div class="empty">Nenhum imóvel cadastrado.</div>'}
    <p class="note">⚠️ Dados históricos Brooklin SP baseados em FipeZap. Todos os valores são editáveis.</p>`;
}

function rConfig(){
  const m=document.getElementById('main');
  const ind=S.indicators;
  const ps={Airbnb:'background:#ffe4e1;color:#c0392b',QuintoAndar:'background:#e1ffe4;color:#1a7a30',Booking:'background:#e1e9ff;color:#1a3a8a'};
  const medBench=BENCH.reduce((a,b)=>a+b.med,0)/BENCH.length;
  m.innerHTML=`
    <div class="sl">📊 Indicadores Financeiros</div>
    <div class="ig">
      <div class="ib"><label>CDI % a.a.</label><div class="irow"><input type="number" value="${ind.cdi}" step="0.01" onchange="upInd('cdi',this.value);ra()"><span class="ipfx">%</span></div></div>
      <div class="ib"><label>IPCA % a.a.</label><div class="irow"><input type="number" value="${ind.ipca}" step="0.01" onchange="upInd('ipca',this.value);ra()"><span class="ipfx">%</span></div></div>
      <div class="ib"><label>Poupança % a.a.</label><div class="irow"><input type="number" value="${ind.poupanca}" step="0.01" onchange="upInd('poupanca',this.value);ra()"><span class="ipfx">%</span></div></div>
      <div class="ib"><label>Selic % a.a.</label><div class="irow"><input type="number" value="${ind.selic}" step="0.01" onchange="upInd('selic',this.value);ra()"><span class="ipfx">%</span></div></div>
    </div>
    <p class="note" style="margin-bottom:1rem">💡 Abr/2026: CDI 14,79% · IPCA 3,81% · Poupança 10,32% · Selic 14,75% · FipeZap 12m: 5,62%</p>

    <div class="sl">🏠 Studios — Benchmark de Mercado SP</div>
    <div class="tc" style="margin-bottom:1rem">
      <div class="tt"><h3>Portfólio vs Região</h3><span class="bdg">Média Studios: ${f(medBench)}/noite</span></div>
      ${S.props.length?S.props.map(p=>{
        const c=cp(p);
        const avgDia=c.ms.reduce((a,m,i)=>{const mm=p.meses[i];return a+(mm.diarias&&mm.ocup?(mm.diarias/(mm.ocup/100||1)/30):0);},0)/12;
        const diaMed=p.meses.reduce((a,mm)=>a+(mm.diariaMed||0),0)/12;
        const d=diaMed-medBench;
        return`<div style="display:flex;justify-content:space-between;align-items:center;padding:.6rem 1rem;border-bottom:1px solid var(--border);font-size:.8rem;flex-wrap:wrap;gap:.35rem">
          <span><strong>${p.nome}</strong></span>
          <span style="font-family:var(--fm)">${f(diaMed)}/noite méd.</span>
          <span style="font-family:var(--fm);color:${d>=0?'var(--green)':'var(--accent)'}">${d>=0?'+':''}${fp(diaMed?d/medBench*100:0)} vs região</span>
          <span>${d>=0?'✅':'⚠️'}</span>
        </div>`;}).join(''):'<div class="empty" style="padding:1rem">Nenhum imóvel.</div>'}
    </div>

    <div class="sl">📌 Studios — SP Zona Sul/Oeste (2025)</div>
    <div class="bg2">
      ${BENCH.map(b=>`<div class="bc">
        <span class="bpl" style="${ps[b.plat]}">${b.plat}</span>
        <div class="bba">${b.bairro}</div><div class="bty">Studio</div>
        <div class="bpr">
          <div><div class="bpm">${f(b.med)}</div><div class="bpr2">${f(b.min)} – ${f(b.max)}</div></div>
          <div class="boc">${b.ocup}% ocup.</div>
        </div></div>`).join('')}
    </div>

    <div class="sl" style="margin-top:1.25rem">💾 Backup</div>
    <div style="display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:.75rem">
      <button onclick="exportData()" style="background:var(--ink);color:#fff;border:none;padding:.65rem 1.25rem;border-radius:8px;font-family:var(--fm);font-size:.72rem;cursor:pointer;text-transform:uppercase">⬇ Exportar JSON</button>
      <button onclick="document.getElementById('imp').click()" style="background:var(--surface);color:var(--ink);border:1px solid var(--border);padding:.65rem 1.25rem;border-radius:8px;font-family:var(--fm);font-size:.72rem;cursor:pointer;text-transform:uppercase">⬆ Importar JSON</button>
      <button onclick="if(confirm('Apagar todos os dados?')){localStorage.clear();location.reload()}" style="background:#fff0f0;color:var(--accent);border:1px solid #f8b8bb;padding:.65rem 1.25rem;border-radius:8px;font-family:var(--fm);font-size:.72rem;cursor:pointer;text-transform:uppercase">🗑 Limpar Tudo</button>
    </div>
    <p class="note">📱 iPad: Safari → Compartilhar (□↑) → "Adicionar à Tela de Início"</p>`;
}

load();ra();
if('serviceWorker' in navigator){
  const sw=`const C='abt-v3';self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.addAll(['./',location.href]))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match('./')))))`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'text/javascript'}))).catch(()=>{});
}
</script>
</body>
